name: Deploy portfolio preview

on:
  push:
    branches: [main]
    paths:
      - "src/ai_observability/static/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Assemble static portfolio
        run: |
          mkdir -p _site/assets
          cp src/ai_observability/static/index.html src/ai_observability/static/triolingo.html _site/
          cp src/ai_observability/static/metrics src/ai_observability/static/events _site/
          cp src/ai_observability/static/styles.css src/ai_observability/static/app.js src/ai_observability/static/vioer.svg _site/assets/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload portfolio artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
