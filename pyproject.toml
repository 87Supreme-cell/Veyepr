[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-observability-pipeline"
version = "0.1.0"
description = "A hands-on local AI training telemetry pipeline for Prometheus and Grafana."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "prometheus-client==0.21.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]
torch = [
    "torch>=2.0",
]

[project.scripts]
ai-observability-demo = "ai_observability.app:main"
veyepr-mock-deploy = "ai_observability.mock_deploy:main"
veyepr-break-drills = "ai_observability.drills:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_observability = ["static/*"]
