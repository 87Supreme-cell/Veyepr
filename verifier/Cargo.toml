[package]
name = "veyepr-verifier"
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
description = "Independent strict verifier for the Veyepr training telemetry contract."
license = "MIT"
publish = false

[dependencies]
serde = { version = "=1.0.216", features = ["derive"] }
serde_json = "=1.0.134"
time = { version = "=0.3.37", features = ["parsing", "serde"] }
